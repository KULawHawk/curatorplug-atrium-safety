[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curatorplug-atrium-safety"
version = "0.1.0a1"
description = "Constitutional compliance plugin for Curator (Atrium Principle 2 enforcement)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jake Leese"},
]
keywords = [
    "curator",
    "curator-plugin",
    "atrium",
    "constitutional-compliance",
    "hash-verify",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
]

dependencies = [
    # NOTE on the ``curator`` dependency:
    # We deliberately do NOT declare ``curator>=1.1.1`` here. There's an
    # unrelated package on PyPI named ``curator`` (Elasticsearch Curator,
    # Python-2 era) that pip will resolve to instead of Jake's Curator
    # project, causing install failures. Until Jake's Curator publishes
    # to PyPI under a unique name (or a private index), the plugin's
    # development install path is:
    #     pip install -e <path-to-Jake's-Curator>
    #     pip install -e .
    # Plugin imports from ``curator`` at runtime; an ``ImportError``
    # surfaces clearly if Curator is missing.
    #
    # Pluggy is transitively required via curator but we list it explicitly
    # so the plugin's @hookimpl markers work even if some future Curator
    # release changes its plugin runtime layout.
    "pluggy>=1.3",
    # xxhash for the verifier module's compute_xxh3 utility.
    "xxhash>=3.0",
    # loguru for the plugin's debug logging. Curator already requires
    # this transitively but listing it makes the plugin standalone-installable.
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.entry-points.curator]
# This is the magic string that makes Curator auto-discover the plugin
# at runtime (per DM-4 of curatorplug-atrium-safety/DESIGN.md v0.2:
# setuptools entry-point discovery is the registration mechanism).
# Curator's pluggy plugin manager looks for entry-points under the
# "curator" group and registers them as plugins.
#
# IMPORTANT: this points at the module-level INSTANCE
# (``plugin = AtriumSafetyPlugin()`` at the bottom of plugin.py), not
# the class itself. Pluggy's ``load_setuptools_entrypoints`` calls
# ``ep.load()`` and registers the result directly without
# instantiating; pointing at a class results in unbound-method calls
# that fail with "missing positional argument" errors. See the
# explanatory comment block at the bottom of plugin.py for the full
# story.
atrium_safety = "curatorplug.atrium_safety.plugin:plugin"

[project.urls]
Homepage = "https://github.com/KULawHawk/curatorplug-atrium-safety"
"Companion: Curator" = "https://github.com/KULawHawk/Curator"
"Companion: Atrium" = "https://github.com/KULawHawk/Atrium"

[tool.setuptools.packages.find]
where = ["src"]
# Allow namespace packages so `curatorplug` can be shared with other
# `curatorplug-*` packages installed alongside this one (e.g., a future
# `curatorplug-atrium-reversibility` could install under
# `curatorplug.atrium_reversibility` without conflict).
namespaces = true

[tool.setuptools.package-data]
"curatorplug.atrium_safety" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
